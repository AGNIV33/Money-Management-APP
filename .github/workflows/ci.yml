name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew ktlintCheck detekt --stacktrace
      - name: Unit tests
        run: ./gradlew test --stacktrace --continue
      - name: Show failing tests
        # Puts the reason of each failing test into the check annotations, so it is readable
        # without a GitHub login (job logs need one).
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = ' '.join((bad.get('message') or bad.text or '').split())[:600]
                      print(f"::error title=Test failed: {case.get('classname')}.{case.get('name')}::{msg}")
          PY
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
