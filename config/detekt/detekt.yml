# Builds on detekt defaults (buildUponDefaultConfig = true). Only overrides live here.
naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: ['Composable']
complexity:
  LongMethod:
    # Compose screens read top-to-bottom; splitting them only to hit a line count hurts clarity.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/designsystem/theme/**', '**/seed/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 140
