# Latest stable versions checked on 2026-11-09. Don't bump majors without asking (CLAUDE.md §9).
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

androidxCore = "1.19.1"
