<div style="margin:0;padding:24px 12px;background:#f5f7f6;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;">
    <tr>
      <td align="center" style="padding:28px 24px 8px 24px;">
        <img src="https://raw.githubusercontent.com/AGNIV33/Money-Management-APP/main/DOCS/brand/kinly-logo-480.png" alt="Kinly" width="220" style="display:block;border:0;max-width:100%;height:auto;">
      </td>
    </tr>
    <tr>
      <td style="padding:8px 28px 0 28px;text-align:center;">
        <h1 style="margin:16px 0 8px 0;font-size:22px;color:#1B7F5B;">Your sign-in code</h1>
        <p style="margin:0 0 20px 0;font-size:15px;line-height:22px;color:#444444;">Enter this code in the Kinly app to sign in.</p>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:0 28px;">
        <div style="background:#eef7f2;border-radius:12px;padding:18px 12px;font-size:34px;font-weight:bold;letter-spacing:8px;color:#1B7F5B;">{{ .Token }}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 28px 8px 28px;text-align:center;">
        <p style="margin:0;font-size:13px;line-height:20px;color:#777777;">This code expires in 1 hour. If you didn't ask for it, you can safely ignore this email.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px 28px 28px;text-align:center;">
        <p style="margin:0;font-size:14px;color:#444444;">Regards,<br><strong>Team Kinly</strong></p>
      </td>
    </tr>
  </table>
</div>
